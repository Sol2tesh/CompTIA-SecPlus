  <style>
    .video-grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:18px;
      margin-top:18px;
    }
    @media (max-width:1100px){ .video-grid{ grid-template-columns:repeat(2,1fr); } }
    @media (max-width:640px){ .video-grid{ grid-template-columns:1fr; } }

    .video-tile{
      position:relative;
      display:block;
      height:240px;
      border-radius:22px;
      overflow:hidden;
      text-decoration:none;
      box-shadow:0 18px 45px rgba(0,0,0,.45);
      border:1px solid rgba(255,255,255,.08);
      transition:transform .2s ease, box-shadow .2s ease;
    }
    .video-tile:hover{
      transform:translateY(-4px);
      box-shadow:0 28px 70px rgba(0,0,0,.65);
    }

    .video-tile img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .video-tile::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(
        to top,
        rgba(0,0,0,.8),
        rgba(0,0,0,.4),
        rgba(0,0,0,.15)
      );
      z-index:1;
    }

    .tile-body{
      position:absolute;
      bottom:0;
      left:0;
      right:0;
      padding:18px;
      z-index:2;
    }
    .tile-title{
      margin:0;
      font-size:20px;
      font-weight:800;
      color:#fff;
    }
    .tile-sub{
      margin-top:6px;
      font-size:14px;
      color:rgba(255,255,255,.85);
    }
  </style>
</head>
